<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="C&C Servicios Integrales S.R.L — Instalaciones eléctricas de alta y media tensión, luminarias viales, infraestructura eléctrica y movimiento de suelo. Santa Fe, Argentina.">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="C&C Servicios Integrales S.R.L">
  <meta property="og:description" content="Instalaciones eléctricas de alta y media tensión, luminarias viales, infraestructura eléctrica. Santa Fe, Argentina.">
  <meta property="og:locale" content="es_AR">

  <title>C&C Servicios Integrales S.R.L</title>

  <!-- Preconnect Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts: Bebas Neue + Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&display=swap" rel="stylesheet">

  <!-- Estilos — orden importante: variables → base → components → sections -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
</head>
<body>

  <!-- Accesibilidad: saltar al contenido principal -->
  <a href="#main-content" class="skip-to-content">Saltar al contenido</a>

  <!-- =====================================================================
       HEADER / NAVBAR
       ===================================================================== -->
  <header class="site-header" role="banner">
    <nav class="navbar" aria-label="Navegación principal">
      <div class="container navbar__inner">

        <!-- Logo -->
        <a href="#inicio" class="navbar__logo" aria-label="C&C Servicios Integrales — Inicio">
          <span class="navbar__logo-text">C&amp;C</span>
        </a>

        <!-- Botón hamburger -->
        <button
          class="navbar__toggle"
          aria-label="Abrir menú de navegación"
          aria-expanded="false"
          aria-controls="nav-overlay"
          type="button"
        >
          <span class="navbar__toggle-bar"></span>
          <span class="navbar__toggle-bar"></span>
          <span class="navbar__toggle-bar"></span>
        </button>

      </div>
    </nav>
  </header>

  <!-- =====================================================================
       OVERLAY MENU FULLSCREEN
       ===================================================================== -->
  <div
    id="nav-overlay"
    class="nav-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación"
    hidden
  >
    <nav class="nav-overlay__nav" aria-label="Menú principal">
      <ol class="nav-overlay__list">
        <li class="nav-overlay__item">
          <a href="#inicio" class="nav-overlay__link">
            <span class="nav-overlay__number" aria-hidden="true">01</span>
            Inicio
          </a>
        </li>
        <li class="nav-overlay__item">
          <a href="#servicios" class="nav-overlay__link">
            <span class="nav-overlay__number" aria-hidden="true">02</span>
            Servicios
          </a>
        </li>
        <li class="nav-overlay__item">
          <a href="#proyectos" class="nav-overlay__link">
            <span class="nav-overlay__number" aria-hidden="true">03</span>
            Proyectos
          </a>
        </li>
        <li class="nav-overlay__item">
          <a href="#nosotros" class="nav-overlay__link">
            <span class="nav-overlay__number" aria-hidden="true">04</span>
            Nosotros
          </a>
        </li>
        <li class="nav-overlay__item">
          <a href="#contacto" class="nav-overlay__link">
            <span class="nav-overlay__number" aria-hidden="true">05</span>
            Contacto
          </a>
        </li>
      </ol>
    </nav>

    <!-- Datos de contacto al pie del overlay -->
    <div class="nav-overlay__contact" aria-label="Datos de contacto">
      <a href="tel:+5493497657453" class="nav-overlay__contact-link">+54 9 3497 65-7453</a>
      <a href="tel:+5491167995686" class="nav-overlay__contact-link">+54 9 11 6799-5686</a>
      <span class="nav-overlay__contact-address">55, 1° piso, Santa Fe</span>
    </div>

  </div>

  <!-- =====================================================================
       CONTENIDO PRINCIPAL
       ===================================================================== -->
  <main id="main-content" tabindex="-1">

    <!-- Sección 1: Hero / Inicio -->
    <section
      id="inicio"
      class="section section--hero"
      aria-label="Inicio"
    >
      <!-- Etapa 3: contenido del hero -->
    </section>

    <!-- Sección 2: Servicios -->
    <section
      id="servicios"
      class="section section--servicios"
      aria-label="Servicios"
    >
      <!-- Etapa 4: grid de servicios -->
    </section>

    <!-- Sección 3: Proyectos / Portfolio -->
    <section
      id="proyectos"
      class="section section--proyectos"
      aria-label="Proyectos"
    >
      <!-- Etapa 5: galería filtrable -->
    </section>

    <!-- Sección 4: Nosotros -->
    <section
      id="nosotros"
      class="section section--nosotros"
      aria-label="Nosotros"
    >
      <!-- Etapa 6: stats animados + texto institucional -->
    </section>

    <!-- Sección 5: Contacto -->
    <section
      id="contacto"
      class="section section--contacto"
      aria-label="Contacto"
    >
      <!-- Etapa 6: formulario + datos de contacto -->
    </section>

  </main>

  <!-- =====================================================================
       FOOTER
       ===================================================================== -->
  <footer class="site-footer" role="contentinfo">
    <!-- Etapa 7: logo, datos legales, links rápidos, redes sociales -->
  </footer>

  <!-- =====================================================================
       BOTÓN FLOTANTE WHATSAPP
       ===================================================================== -->
  <a
    href="https://wa.me/5493497657453"
    class="whatsapp-btn"
    aria-label="Contactar por WhatsApp"
    target="_blank"
    rel="noopener noreferrer"
  >
    <!-- Etapa 6: ícono SVG de WhatsApp -->
  </a>

  <!-- =====================================================================
       SCRIPTS
       GSAP + ScrollTrigger vía CDN (jsDelivr, versión fija para estabilidad)
       ===================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <script src="assets/js/animations.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>
